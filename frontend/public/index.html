<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Projeção Financeira</title>
  <style>
    body { font-family: sans-serif; max-width: 650px; margin: 40px auto; padding: 0 20px; }
    .campo { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
    button:hover { background-color: #0056b3; }
    
    /* Estilos das Tabelas Dinâmicas */
    .bloco-ano { margin-top: 30px; }
    .bloco-ano h3 { margin-bottom: 10px; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

  <h2>Projeção Financeira por Ano</h2>

  <div class="campo">
    <label for="saldo">Saldo Atual (R$):</label>
    <input type="number" id="saldo" placeholder="Ex: 1000">
  </div>

  <div class="campo">
    <label for="gastos">Gastos Fixos Mensais (R$):</label>
    <input type="number" id="gastos" placeholder="Ex: 500">
  </div>

  <div class="campo">
    <label for="receitas">Receitas Fixas Mensais (R$):</label>
    <input type="number" id="receitas" placeholder="Ex: 2000">
  </div>

  <div class="campo">
    <label for="anos">Tempo de Projeção (Anos):</label>
    <input type="number" id="anos" value="1" min="1" max="30">
  </div>

  <button onclick="calcularEExibir()">Gerar Projeção</button>

  <!-- O JavaScript vai criar as tabelas aqui dentro -->
  <div id="containerProjecao"></div>

  <script src="../src/core/regras.js"></script>
  <script src="../src/database/banco.js"></script>
  <script src="../src/ui/estado.js"></script>
  <script src="../src/ui/interface.js"></script>
</body>
</html>
